name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask pytest

      - name: Compile all Python
        run: python -m compileall -q .

      - name: Validate installer and source lock syntax
        run: |
          bash -n install.sh scripts/verify-sources.sh scripts/check-upstream-updates.sh
          bash scripts/verify-sources.sh --offline

      - name: Verify locked external sources
        run: bash scripts/verify-sources.sh

      - name: Smoke test routes and logic
        run: python tests/smoke.py

      - name: Unit tests
        run: pytest -q tests/
