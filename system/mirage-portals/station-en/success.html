<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're online</title>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#eaf1f7; color:#16222e;
    }
    .card {
      width:min(100%,380px); background:#ffffff; border:1px solid #cddbe8;
      border-radius:14px; padding:28px 24px; text-align:center;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
    }
    .check {
      width:52px; height:52px; margin:0 auto 16px; display:grid; place-items:center;
      border-radius:50%; background:#e3eefb; color:#0a5bd3; font-size:28px; font-weight:700;
    }
    h1 { margin:0 0 8px; font-size:22px; }
    p { margin:0; color:#5a6b7a; font-size:14px; line-height:1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>You're online</h1>
    <p>Have a safe trip.</p>
  </main>
</body>
</html>
