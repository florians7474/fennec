[main]
mon_start_cmd = ""
mon_stop_cmd = ""
name = "fennec"
lang = "en"
iface = "wlan1"

# AI brain off: it is unused here, it crashes with current
# stable-baselines3/gymnasium, and keeping it off lets the install skip its
# torch/CUDA stack. ai.load() returns before importing those, so capture is
# unaffected.
[ai]
enabled = false

[main.plugins.grid]
enabled = false
report = false

[main.plugins.auto-update]
enabled = false

[main.plugins.fix_services]
enabled = false

[main.plugins.gps]
enabled = true
device = "/dev/ttyACM0"
speed = 9600

[personality]
advertise = false
deauth = true
associate = true

[ui.web]
enabled = true
address = "0.0.0.0"
port = 8080
username = "pwnagotchi"
password = "pwnagotchi"

[ui.display]
enabled = false

[bettercap]
username = "pwnagotchi"
password = "__BETTERCAP_PASS__"
