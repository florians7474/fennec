<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network access</title>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#f3f5f7; color:#1f2933;
    }
    .card {
      width:min(100%, 380px); background:#fff; border:1px solid #d8dee4;
      border-radius:14px; padding:24px; box-shadow:0 8px 24px rgba(0,0,0,.08);
    }
    .brand { text-align:center; margin-bottom:20px; }
    .brand h1 { margin:0 0 6px; font-size:22px; }
    .brand p { margin:0; color:#68737d; font-size:14px; line-height:1.45; }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input {
      width:100%; min-height:44px; padding:10px 12px; border:1px solid #bcc5cd;
      border-radius:9px; background:#fff; color:#1f2933; font-size:16px; outline:none;
    }
    input:focus { border-color:#6b7785; box-shadow:0 0 0 3px rgba(107,119,133,.15); }
    button {
      width:100%; min-height:46px; margin-top:18px; border:0; border-radius:9px;
      background:#20262d; color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    }
    .note { margin:14px 0 0; text-align:center; color:#7a858f; font-size:11px; line-height:1.4; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <h1>Wi-Fi access</h1>
      <p>Enter the Wi-Fi password.</p>
    </div>
    <!-- Submit the form to the portal server using POST. -->
    <form id="login-form" action="/" method="POST" autocomplete="off">
      <label for="password">Wi-Fi password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <button type="submit">Continue</button>
    </form>
      </main>
</body>
</html>
