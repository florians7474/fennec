<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Scout</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .topbar { flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:8px 12px;
              background:#161b22; border-bottom:1px solid #30363d; }
    .back { color:#e6edf3; text-decoration:none; font-size:22px; line-height:1; padding:0 4px; }
    .tete { width:24px; height:24px; filter:brightness(0) invert(1); }
    .title { font-size:15px; font-weight:600; flex:1; }
    .pill { font-size:11px; font-weight:500; border-radius:20px; padding:3px 10px; }
    .pill.on { background:#7BD88F; color:#13261a; }
    .pill.idle { background:#21262d; color:#8b949e; }

    .barbody { flex:1 1 auto; overflow-y:auto; padding:8px 12px 12px; }

    .controls { display:flex; gap:8px; align-items:center; }
    .controls .lead { font-size:12px; color:#8b949e; flex:1; }
    .startbtn { border:0.5px solid #2b6d3f; background:#13261a; color:#7bd88f; border-radius:8px;
                padding:8px 18px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
                text-decoration:none; }
    .startbtn.stop { border-color:#7a1f1f; background:#2a1414; color:#f0999b; }

    .scoutband { display:flex; align-items:center; gap:10px; background:#11161d;
                 border:1px solid #23272f; border-radius:8px; padding:6px 10px; margin-top:8px; }
    .scoutband img { width:46px; height:46px; image-rendering:pixelated; animation:bob 2.4s ease-in-out infinite; filter:brightness(0) invert(1); }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    .scoutband .sbtext { flex:1; min-width:0; }
    .sstatus { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:#7bd88f; }
    .ssub { font-size:10px; color:#8b949e; margin-top:1px; }
    .deauth { flex:0 0 auto; display:inline-flex; align-items:center; gap:5px; font-size:11px;
              color:#e3b341; background:#241a00; border:0.5px solid #5a4a10; border-radius:999px;
              padding:4px 10px; }
    .deauth b { font-weight:600; }

    .adapters { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; }
    .chip { display:inline-flex; align-items:center; gap:6px; font-size:11px; border-radius:999px; padding:4px 11px; }
    .chip.on { background:#11261a; border:0.5px solid #2b6d3f; color:#bfe9c9; }
    .chip.on .d { width:6px; height:6px; border-radius:50%; background:#2ea043; }
    .chip.add { border:1px dashed #3a4150; color:#8b949e; }

    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
    .card { background:#161b22; border-radius:8px; padding:6px 10px; }
    .card .n { font-size:10px; color:#8b949e; } .card .v { font-size:19px; font-weight:600; }

    .section-label { font-size:11px; color:#6e757e; margin:12px 2px 5px; display:flex; justify-content:space-between; }
    .cap { display:flex; align-items:center; gap:8px; background:#161b22;
           border-radius:8px; padding:6px 10px; margin-bottom:6px; }
    .cap .nm { font-size:12px; display:flex; align-items:center; gap:7px; min-width:0; flex:1; }
    .cap .nm .label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cap .nm span.t { font-size:10px; border-radius:10px; padding:1px 7px; flex:0 0 auto; }
    .cap .nm span.hs { background:#143a2a; color:#7bd88f; }
    .cap .nm span.pm { background:#0f5a4a; color:#9fe1cb; }
    .cap .nm span.sn { background:#21262d; color:#8b949e; }
    .cap .bs { font-family:ui-monospace,Consolas,monospace; font-size:10px; color:#8b949e; flex:0 0 auto; }
    .empty { color:#8b949e; font-size:13px; text-align:center; margin-top:26px; line-height:1.7; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="/">&larr;</a>
    <img class="tete" src="/static/scout.png" alt="">
    <div class="title">Scout</div>
    <span class="pill idle" id="status">Idle</span>
  </div>

  <div class="barbody">
    <div class="controls">
      <div class="lead" id="lead">Start the sweep to harvest handshakes and PMKIDs.</div>
      <a class="startbtn" id="startbtn" href="/scout/toggle">Start</a>
    </div>

    <div class="scoutband">
      <img id="scoutface" src="/static/scout6.png" alt="">
      <div class="sbtext">
        <div class="sstatus" id="sstatus">Idle — press Start to hunt.</div>
        <div class="ssub" id="ssub"></div>
      </div>
      <span class="deauth" id="deauthpill" style="display:none">⚡ <b id="deauthn">0</b> deauth
    </div>

    <div class="adapters" id="slots"></div>

    <div class="cards">
      <div class="card"><div class="n">Handshakes</div><div class="v" id="c-hs">0</div></div>
      <div class="card"><div class="n">PMKID</div><div class="v" id="c-pm">0</div></div>
      <div class="card"><div class="n">APs seen</div><div class="v" id="c-ap">0</div></div>
    </div>

    <div class="section-label"><span>Live captures</span><span>feeds Sly &rarr;</span></div>
    <div id="list"></div>
  </div>

  <script>
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

    var FACES = {
      idle: ["/static/scout6.png"],
      wide: ["/static/scout1.png", "/static/scout3.png", "/static/scout5.png", "/static/scout2.png"]
    };
    var faceSet = FACES.idle, faceI = 0, happyUntil = 0, lastCount = 0;
    function faceTick(){
      var img = document.getElementById('scoutface'); if (!img) return;
      if (Date.now() < happyUntil){ img.src = "/static/scout4.png"; return; }
      img.src = faceSet[faceI % faceSet.length]; faceI++;
    }
    setInterval(faceTick, 3200);

    var quips = [["sniffing the air…","PMKID sweep"],["hunting on 5GHz…","hopping channels"],["flushing clients out…","deauth + capture"],["nose to the ground","forcing handshakes"]];
    var qi = 0;
    function rollQuip(s){
      if(!s.active){ document.getElementById('sstatus').textContent='Idle — press Start to hunt.';
                     document.getElementById('ssub').textContent=''; return; }
      var q = quips[qi % quips.length]; qi++;
      document.getElementById('sstatus').textContent = q[0];
      document.getElementById('ssub').textContent = q[1];
    }
    function updateFace(s){
      faceSet = s.active ? FACES.wide : FACES.idle;
      var count = (s.handshakes||0) + (s.pmkid||0);
      if (count > lastCount) happyUntil = Date.now() + 1200;
      lastCount = count;
    }

    function chip(a){
      if(a) return '<span class="chip on"><span class="d"></span>'+esc(a.label)+' · '+esc(a.iface)+' · '+esc(a.bands)+'GHz</span>';
      return '<span class="chip add">+ 2nd adapter</span>';
    }

    function render(s){
      var st = document.getElementById('status');
      st.className = 'pill ' + (s.active?'on':'idle');
      st.textContent = s.active ? 'Sweeping' : 'Idle';

      var btn = document.getElementById('startbtn');
      btn.textContent = s.active ? 'Stop' : 'Start';
      btn.className = 'startbtn' + (s.active?' stop':'');
      document.getElementById('lead').textContent = s.active
        ? 'Harvesting — captures drop into Sly automatically.'
        : 'Start the sweep to harvest handshakes and PMKIDs.';

      var ads = s.adapters || [];
      document.getElementById('slots').innerHTML = chip(ads[0]||null) + chip(ads[1]||null);
      document.getElementById('c-hs').textContent = s.handshakes||0;
      document.getElementById('c-pm').textContent = s.pmkid||0;
      document.getElementById('c-ap').textContent = s.aps||0;

      var dp = document.getElementById('deauthpill');
      if(s.active && (s.deauth||0) > 0){
        dp.style.display='inline-flex';
        document.getElementById('deauthn').textContent = (s.deauth||0).toLocaleString();
      } else dp.style.display='none';

      var rec = s.recent || [], html='';
      if(!rec.length){ html = '<div class="empty">'+(s.active?'Listening… networks will show here.':'No captures yet.')+'</div>'; }
      else rec.forEach(function(c){
        var cls = c.type==='PMKID' ? 'pm' : (c.type==='seen' ? 'sn' : 'hs');
        html += '<div class="cap"><div class="nm"><span class="t '+cls+'">'+esc(c.type||'HS')+
                '</span><span class="label">'+esc(c.name)+'</span></div>'+
                '<span class="bs">'+esc(c.bssid)+'</span></div>';
      });
      document.getElementById('list').innerHTML = html;
    }

    function poll(){ fetch('/scout/state',{cache:'no-store'}).then(function(r){return r.json();}).then(function(s){ render(s); rollQuip(s); updateFace(s); }).catch(function(){}); }
    poll(); setInterval(poll, 3000);
  </script>
</body>
</html>
