<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Allowed networks</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .titre { font-size:16px; font-weight:600; flex:1; }
    .scan-btn {
      border:1px solid #2ea043; color:#2ea043; text-decoration:none; border-radius:8px;
      padding:7px 12px; font-size:13px; font-weight:600;
    }
    .liste { flex:1 1 auto; overflow-y:auto; padding:8px 12px; }
    .ligne {
      display:flex; align-items:center; gap:8px; padding:10px 12px; margin-bottom:8px;
      background:#161b22; border:1px solid #30363d; border-radius:10px;
    }
    .infos { flex:1; min-width:0; }
    .rnom { font-size:14px; font-weight:600; }
    .rbssid { font-size:11px; color:#8b949e; font-family:ui-monospace,Consolas,monospace; }
    .rcle { font-size:10px; margin-top:2px; }
    .rcle.ok { color:#2ea043; }
    .rcle.no { color:#8b949e; }
    .editer { color:#58a6ff; text-decoration:none; font-size:18px; padding:2px 6px; }
    .retirer { color:#da3633; text-decoration:none; font-size:20px; padding:2px 8px; }
    .vide { color:#8b949e; font-size:13px; text-align:center; margin-top:28px; line-height:1.6; }
    .ajout {
      flex:0 0 auto; display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px;
      background:#161b22; border-top:1px solid #30363d; align-items:center;
    }
    .ajout input {
      background:#0d1117; border:1px solid #30363d; border-radius:8px; color:#e6edf3;
      padding:8px 10px; font-size:13px;
    }
    .ajout input[name="nom"] { width:120px; }
    .ajout input[name="bssid"] { flex:1 1 200px; font-family:ui-monospace,Consolas,monospace; }
    .ajout input[name="cle"] { flex:1 1 200px; }
    .ajout button {
      border:none; border-radius:8px; background:#2ea043; color:#fff;
      font-size:13px; font-weight:600; padding:9px 14px; cursor:pointer;
    }
    .pied { flex:0 0 auto; text-align:center; padding:4px 0 8px; }
    .pied a { color:#8b949e; font-size:11px; text-decoration:none; }

    .modal {
      display:none; position:absolute; top:0; left:0; width:480px; height:320px; background:rgba(0,0,0,.6);
      z-index:10; align-items:center; justify-content:center;
    }
    .modal.on { display:flex; }
    .map {
      width:360px; background:#161b22; border:1px solid #30363d; border-radius:12px;
      padding:16px; display:flex; flex-direction:column; gap:10px;
    }
    .map h3 { font-size:15px; font-weight:600; }
    .map .sous { font-size:11px; color:#8b949e; font-family:ui-monospace,Consolas,monospace; margin-top:-4px; }
    .map input {
      background:#0d1117; border:1px solid #30363d; border-radius:8px; color:#e6edf3;
      padding:9px 10px; font-size:13px; width:100%;
    }
    .map .lignes { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
    .map .annuler {
      border:1px solid #30363d; background:none; color:#e6edf3; border-radius:8px;
      padding:9px 14px; font-size:13px; cursor:pointer;
    }
    .map .valider {
      border:none; background:#2ea043; color:#fff; border-radius:8px;
      padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;
    }
    .map .danger { background:#da3633; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/">&larr;</a>
    <div class="titre">Allowed networks</div>
    <a class="scan-btn" href="/scan?source=direct&rescan=1">Scan</a>
  </div>

  <div class="liste">
    {% if reseaux %}
      {% for r in reseaux %}
      <div class="ligne">
        <div class="infos">
          <div class="rnom">{{ r.nom }}</div>
          <div class="rbssid">{{ r.bssid }}</div>
          {% if r.cle %}<div class="rcle ok">&#128273; key saved</div>{% else %}<div class="rcle no">no key</div>{% endif %}
        </div>
                <a class="editer" href="#"
           onclick='openEdit("{{ r.bssid }}", {{ r.nom|tojson }}, {{ (r.cle or "")|tojson }}); return false;'
           title="Edit">&#9998;</a>
        <a class="retirer" href="/whitelist/remove/{{ r.bssid }}" title="Remove">&times;</a>
      </div>
      {% endfor %}
    {% else %}
      <div class="vide">No allowed network yet.<br>Scan, or add your router below.</div>
    {% endif %}
  </div>

  <form class="ajout" method="post" action="/whitelist/add">
    <input type="text" name="nom" placeholder="Name (e.g. Home)">
    <input type="text" name="bssid" placeholder="AA:BB:CC:DD:EE:FF" required>
    <input type="text" name="cle" placeholder="Wi-Fi key (optional)">
    <button type="submit">Add</button>
  </form>

  <div class="pied">
    <a href="#" onclick="openConfirm('/whitelist/reset'); return false;">Clear all</a>
  </div>

  <div class="modal" id="modalEdit">
    <form class="map" method="post" action="/whitelist/edit">
      <h3>Edit network</h3>
      <div class="sous" id="editBssidLabel"></div>
      <input type="hidden" name="bssid" id="editBssid">
      <input type="text" name="nom" id="editNom" placeholder="Name">
      <input type="text" name="cle" id="editCle" placeholder="Wi-Fi key (empty = remove)">
      <div class="lignes">
        <button type="button" class="annuler" onclick="closeEdit()">Cancel</button>
        <button type="submit" class="valider">Save</button>
      </div>
    </form>
  </div>

  <div class="modal" id="modalConfirm">
    <div class="map">
      <h3>Clear everything?</h3>
      <div class="lignes">
        <button type="button" class="annuler" onclick="closeConfirm()">Cancel</button>
        <button type="button" class="valider danger" onclick="confirmAction()">Clear all</button>
      </div>
    </div>
  </div>

  <script>
    var confirmUrl = null;
    function openConfirm(url){ confirmUrl = url; document.getElementById('modalConfirm').classList.add('on'); }
    function closeConfirm(){ document.getElementById('modalConfirm').classList.remove('on'); }
    function confirmAction(){ if(confirmUrl){ window.location.href = confirmUrl; } }

    function openEdit(bssid, nom, cle){
      document.getElementById('editBssid').value = bssid;
      document.getElementById('editBssidLabel').textContent = bssid;
      document.getElementById('editNom').value = nom || '';
      document.getElementById('editCle').value = cle || '';
      document.getElementById('modalEdit').classList.add('on');
    }
    function closeEdit(){
      document.getElementById('modalEdit').classList.remove('on');
    }

    (function(){
      var liste = document.querySelector('.liste');
      if(!liste) return;
      var key = 'scroll:' + location.pathname;
      try { var y = sessionStorage.getItem(key); if (y !== null) liste.scrollTop = parseInt(y,10); } catch(e){}
      liste.addEventListener('click', function(e){
        if(!e.target.closest('a,button')) return;
        try { sessionStorage.setItem(key, liste.scrollTop); } catch(e){}
      });
    })();
  </script>
  <script src="/static/keyboard.js"></script>
</body>
</html>
