<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>{{ name }}</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .titre { font-size:14px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dl { background:#8b7fd4; color:#1a1230; border:none; border-radius:8px; font-size:12px;
          font-weight:600; padding:7px 12px; text-decoration:none; white-space:nowrap; }
    .corps { flex:1 1 auto; overflow:auto; padding:10px 12px; }
    pre { font-family:ui-monospace,Consolas,monospace; font-size:11px; line-height:1.5;
          white-space:pre; color:#c9d1d9; }
    .note { color:#8b949e; font-size:12px; padding:6px 2px; }
    .trunc { color:#e3b341; font-size:11px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/hugin/files">&larr;</a>
    <div class="titre">{{ name }}</div>
    <a class="dl" href="/hugin/file?path={{ rel|urlencode }}&amp;dl=1">Download</a>
  </div>

  <div class="corps">
    {% if content is not none %}
      <pre>{{ content }}</pre>
      {% if truncated %}<div class="trunc">Preview truncated — download the file for the full content.</div>{% endif %}
    {% else %}
      <div class="note">Binary or unsupported file. Use Download to get it.</div>
    {% endif %}
  </div>
</body>
</html>
