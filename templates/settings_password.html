<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fennec — Password</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0d1117; color:#e6edf3;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  .wrap { height:100%; display:flex; flex-direction:column; }
  .top { padding:6px 12px; display:flex; align-items:center; gap:10px; }
  .back { background:#161b22; border:1px solid #30363d; color:#e6edf3; border-radius:8px;
    width:40px; height:32px; font-size:16px; }
  .title { font-size:16px; font-weight:700; }
  .sub { font-size:12px; color:#8b949e; }
  .body { flex:1 1 auto; overflow-y:auto; padding:0 12px; }
  .fld { margin-bottom:6px; }
  .fld .lbl { font-size:12px; color:#8b949e; margin-bottom:3px; }
  .fld input { width:100%; background:#161b22; border:1px solid #30363d; color:#e6edf3;
    border-radius:8px; padding:8px; font-size:15px; }
  .fld input:focus { border-color:#01F994; outline:none; }
  .err { margin:0 0 8px; background:#3d1d1d; border:1px solid #f85149; color:#ffb3ad;
    font-size:12px; padding:6px 8px; border-radius:8px; display:none; }
  .ok { margin:0 0 8px; background:#12331f; border:1px solid #2ea043; color:#7ee2a8;
    font-size:12px; padding:6px 8px; border-radius:8px; display:none; }
  .act { display:flex; gap:8px; margin:4px 0 10px; }
  .btn { flex:1; background:#161b22; border:1px solid #30363d; color:#e6edf3;
    border-radius:10px; padding:9px; font-size:14px; }
  .btn.primary { background:#01F994; border-color:#01F994; color:#07120c; font-weight:700; }
  .btn:active { filter:brightness(1.15); }
  .kb { padding:2px; background:#010409; }
  .krow { display:flex; justify-content:center; gap:4px; margin-bottom:3px; }
  .key { flex:1; max-width:9%; background:#21262d; border:1px solid #30363d; color:#e6edf3;
    border-radius:6px; height:28px; font-size:14px; }
  .key:active { background:#30363d; }
  .key.wide { max-width:18%; font-size:12px; color:#8b949e; }
  .key.space { max-width:40%; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <button class="back" onclick="location.href='/'">&#8592;</button>
      <div>
        <div class="title">Change password</div>
        <div class="sub">The SSH / system login for this device.</div>
      </div>
    </div>

    <div class="body">
      <div class="err" id="err"></div>
      <div class="ok" id="ok"></div>
      <div class="fld">
        <div class="lbl">Current password</div>
        <input id="current" type="password" autocomplete="off">
      </div>
      <div class="fld">
        <div class="lbl">New password (6+ characters)</div>
        <input id="new" type="password" autocomplete="off">
      </div>
      <div class="fld">
        <div class="lbl">Confirm new password</div>
        <input id="confirm" type="password" autocomplete="off">
      </div>
      <div class="act">
        <button class="btn" onclick="location.href='/'">Cancel</button>
        <button class="btn primary" id="save" onclick="change()">Change password</button>
      </div>
    </div>

    <div class="kb" id="kb"></div>
  </div>

<script>
  var shift=false, sym=false;
  var target=document.getElementById("current");
  ["current","new","confirm"].forEach(function(id){
    document.getElementById(id).addEventListener("focus",function(){
      target=this;
      // Keep the tapped field visible above the on-screen keyboard.
      var f=this;
      setTimeout(function(){ f.scrollIntoView({block:"center"}); }, 50);
    });
  });
  document.getElementById("current").focus();

  function showErr(m){ var e=document.getElementById("err"); e.textContent=m; e.style.display="block";
    document.getElementById("ok").style.display="none"; }

  function change(){
    var cur=document.getElementById("current").value;
    var nw=document.getElementById("new").value;
    var cf=document.getElementById("confirm").value;
    if(nw.length<6){ showErr("The new password must be at least 6 characters."); return; }
    if(nw!==cf){ showErr("The new passwords do not match."); return; }
    var btn=document.getElementById("save"); btn.disabled=true;
    fetch("/settings/password/change",{ method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ current:cur, "new":nw, confirm:cf }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        btn.disabled=false;
        if(d.ok){
          document.getElementById("err").style.display="none";
          var o=document.getElementById("ok");
          o.textContent="Password changed. Use it next time you SSH in.";
          o.style.display="block";
          document.getElementById("current").value="";
          document.getElementById("new").value="";
          document.getElementById("confirm").value="";
        } else { showErr(d.error || "Could not change the password."); }
      })
      .catch(function(){ btn.disabled=false; showErr("Could not change the password."); });
  }

  var letters=[["q","w","e","r","t","y","u","i","o","p"],
               ["a","s","d","f","g","h","j","k","l"],
               ["z","x","c","v","b","n","m"]];
  var symbols=[["1","2","3","4","5","6","7","8","9","0"],
               ["@","#","$","%","&","-","_","+","(",")"],
               [".",",",":",";","!","?","/","*"]];
  function render(){
    var kb=document.getElementById("kb"); kb.innerHTML="";
    var rows = sym ? symbols : letters;
    rows.forEach(function(row,ri){
      var d=document.createElement("div"); d.className="krow";
      if(!sym && ri===2){ d.appendChild(mk(shift?"↑":"⇧","wide",function(){shift=!shift;render();})); }
      row.forEach(function(c){
        var label = (!sym && shift) ? c.toUpperCase() : c;
        d.appendChild(mk(label,"",function(){ type(label); if(shift){shift=false;render();} }));
      });
      if(ri===2){ d.appendChild(mk("⌫","wide",function(){ target.value=target.value.slice(0,-1); })); }
      kb.appendChild(d);
    });
    var last=document.createElement("div"); last.className="krow";
    last.appendChild(mk(sym?"ABC":"?123","wide",function(){sym=!sym;render();}));
    last.appendChild(mk("space","space",function(){type(" ");}));
    kb.appendChild(last);
  }
  function mk(label,cls,fn){
    var b=document.createElement("button");
    b.className="key"+(cls?" "+cls:""); b.textContent=label;
    b.addEventListener("mousedown",function(e){ e.preventDefault(); });
    b.addEventListener("click",fn);
    return b;
  }
  function type(c){ target.value += c; }
  render();
</script>
</body>
</html>
