<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Mole</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .topbar { flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:8px 12px;
              background:#161b22; border-bottom:1px solid #30363d; }
    .back { color:#e6edf3; text-decoration:none; font-size:22px; line-height:1; padding:0 4px; }
    .tete { width:24px; height:24px; color:#c98a3a; }
    .title { font-size:15px; font-weight:600; flex:1; }
    .pill { font-size:11px; font-weight:500; border-radius:20px; padding:3px 10px; }
    .pill.cap { background:#7BD88F; color:#13261a; }
    .pill.rel { background:#e5534b; color:#2a0b0b; }
    .pill.idle { background:#21262d; color:#8b949e; }

    .modes { flex:0 0 auto; display:flex; gap:8px; padding:8px 12px 0; }
    .mode { flex:1; text-align:center; text-decoration:none; border:1px solid #30363d;
            color:#8b949e; background:#151a21; border-radius:8px; padding:9px 0;
            font-size:13px; font-weight:500; }
    .mode.cap.on { background:#17311f; border-color:#2ea043; color:#7BD88F; }
    .mode.rel.on { background:#2a1113; border-color:#a33; color:#f2a3a3; }

    .helper { flex:0 0 auto; font-size:11px; color:#79b8e8; background:#12202e;
              border-radius:6px; padding:7px 10px; margin:8px 12px 0; }
    .warn { flex:0 0 auto; font-size:12px; color:#3a1d00; background:#f0883e;
            font-weight:600; padding:7px 12px; margin:8px 12px 0; border-radius:6px; }

    .body { flex:1 1 auto; overflow-y:auto; padding:8px 12px 12px; }

    .verdict { border-radius:10px; padding:9px 12px; border:1px solid #30363d;
               background:#161b22; margin-bottom:8px; }
    .verdict .vlabel { font-size:15px; font-weight:600; }
    .verdict .vdetail { font-size:11px; color:#8b949e; margin-top:2px; }
    .verdict.critical { background:#2a0f0f; border-color:#a32d2d; }
    .verdict.critical .vlabel { color:#f2a3a3; } .verdict.critical .vdetail { color:#c98a8a; }
    .verdict.warning { background:#241a00; border-color:#8a6d16; }
    .verdict.warning .vlabel { color:#e3b341; }
    .verdict.idle .vlabel { color:#8b949e; }

    .section-label { font-size:11px; color:#6e757e; margin:10px 2px 5px; }
    .acct { border-radius:8px; padding:7px 10px; margin-bottom:6px;
            font-family:ui-monospace,Consolas,monospace; font-size:11px;
            display:flex; justify-content:space-between; gap:8px; }
    .acct .who { flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e6edf3; }
    .acct .tag { flex:0 0 auto; white-space:nowrap; }
    .acct.cracked { background:#10140f; border:0.5px solid #2b3a22; }
    .acct.cracked .tag { color:#a9d683; }
    .acct.robust { background:#241a00; border:0.5px solid #5a4a10; }
    .acct.robust .tag { color:#e3b341; }
    .acct.pending { background:#161b22; border:0.5px solid #30363d; }
    .acct.pending .tag { color:#7a818a; }

    .row { display:flex; align-items:center; justify-content:space-between;
           background:#161b22; border-radius:8px; padding:8px 10px; margin-bottom:6px; }
    .row .k { font-size:12px; color:#8b949e; } .row .v { font-size:13px; font-weight:600; }
    .row .v .dom { font-family:ui-monospace,Consolas,monospace; color:#c9cdd3; font-weight:400; }
    .host { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:#8b949e;
            padding:3px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty { color:#8b949e; font-size:13px; text-align:center; margin-top:30px; line-height:1.7; }

    .crackbar { font-size:12px; font-weight:500; border-radius:8px; padding:8px 12px;
                margin:8px 0 2px; }
    .crackbar.run { background:#1b2733; border:0.5px solid #2f5d86; color:#79b8e8; }
    .crackbar.ok  { background:#13261a; border:0.5px solid #2b6d3f; color:#7bd88f; }
    .crackbar.err { background:#2a0f0f; border:0.5px solid #a32d2d; color:#f2a3a3; }

    .action { margin-top:12px; }
    .action .btn { display:block; width:100%; text-align:center; border:0.5px solid #313945;
                   background:#1B2129; color:#e6edf3; border-radius:8px; padding:13px 0;
                   font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; }
    .action .btn:disabled { opacity:.5; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="/">&larr;</a>
    <svg class="tete" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="4" rx="1"/><rect x="3" y="17" width="6" height="4" rx="1"/>
      <rect x="15" y="17" width="6" height="4" rx="1"/><path d="M12 7v3M6 17v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/>
    </svg>
    <div class="title">Mole</div>
    <span class="pill idle" id="status">Idle</span>
  </div>

  <div class="modes">
    <a class="mode cap" id="m-cap" href="/mole/toggle">Capture</a>
    <a class="mode rel" id="m-rel" href="/mole/relay">Relay</a>
  </div>

  <div class="helper" id="helper">…</div>

  {% if err == 'eth' %}
  <div class="warn">Plug in an Ethernet cable first — Mole is a wired drop box.</div>
  {% elif err == 'start' %}
  <div class="warn">Could not start — check the install.</div>
  {% endif %}

  <div class="body" id="body"></div>

  <script>
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

    function header(s){
      var r = s.relay || {}, st = document.getElementById('status');
      if(s.active){ st.className='pill cap'; st.textContent='Capturing'; }
      else if(r.active){ st.className='pill rel'; st.textContent='Relaying'; }
      else { st.className='pill idle'; st.textContent='Idle'; }

      document.getElementById('m-cap').className = 'mode cap' + (s.active?' on':'');
      document.getElementById('m-rel').className = 'mode rel' + (r.active?' on':'');

      var h = document.getElementById('helper'), t;
      if(s.active) t = (s.accounts&&s.accounts.length) ? 'Captured — crack the weak ones, or switch to Relay.' : 'Listening — trigger a login on a target to capture it.';
      else if(r.active) t = (r.relayed) ? 'Relaying — loot captured below.' : 'Relaying — waiting for a host to authenticate…';
      else t = 'Plug into a network, then choose Capture or Relay.';
      h.textContent = t;
    }

    function render(s){
      header(s);
      var r = s.relay || {}, c = s.crack || {}, html='';

      var v = s.verdict || {};
      html += '<div class="verdict '+(v.level||'idle')+'"><div class="vlabel">'+esc(v.label)+
              '</div><div class="vdetail">'+esc(v.detail)+'</div></div>';

      if(r.active){
        html += '<div class="section-label">Targets</div>';
        html += '<div class="row"><span class="k">In range</span><span class="v">'+
                (r.smb_targets||0)+' SMB · '+(r.dc_targets||0)+' DC</span></div>';
        var loot = (r.loot||[]).concat(r.dumps||[]);
        if(loot.length){ html += '<div class="section-label">Loot</div>';
          loot.forEach(function(f){ html += '<div class="host">'+esc(f)+'</div>'; }); }
        else { html += '<div class="empty">Waiting for a host to authenticate…</div>'; }
        document.getElementById('body').innerHTML = html;
        return;
      }

      // Capture view
      var hasAccts = s.accounts && s.accounts.length;
      if(!hasAccts && !s.active){
        html += '<div class="empty">Choose Capture to listen on the network,<br>or Relay to attack it.</div>';
        document.getElementById('body').innerHTML = html;
        return;
      }

      if(hasAccts){
        html += '<div class="section-label">Credentials captured ('+s.accounts.length+')</div>';
        s.accounts.forEach(function(a){
          var who = esc((a.domain?a.domain+'\\':'')+a.user);
          if(a.cracked) html += '<div class="acct cracked"><span class="who">'+who+'</span><span class="tag">'+esc(a.password)+'</span></div>';
          else if(c.done) html += '<div class="acct robust"><span class="who">'+who+'</span><span class="tag">robust</span></div>';
          else html += '<div class="acct pending"><span class="who">'+who+'</span><span class="tag">not cracked yet</span></div>';
        });
      }

      html += '<div class="section-label">Network</div>';
      html += '<div class="row"><span class="k">Domain</span><span class="v"><span class="dom">'+esc(s.domain||'—')+'</span></span></div>';
      html += '<div class="row"><span class="k">Passwords recovered</span><span class="v">'+(s.passwords||0)+'</span></div>';
      html += '<div class="row"><span class="k">Machines found</span><span class="v">'+(s.host_count||0)+'</span></div>';
      if(s.hosts && s.hosts.length){ html += '<div class="section-label">Hosts</div>';
        s.hosts.slice(0,12).forEach(function(h){ html += '<div class="host">'+esc(h.ip)+(h.vendor?' · '+esc(h.vendor):'')+'</div>'; }); }

      // crack status
      if(c.running){ var left=Math.max(0,(c.started+c.max)-Math.floor(Date.now()/1000));
        html += '<div class="crackbar run">Cracking in progress… '+left+'s left</div>'; }
      else if(c.error==='needs John jumbo'){ html += '<div class="crackbar err">Cracking unavailable — John jumbo not installed</div>'; }
      else if(c.error){ html += '<div class="crackbar err">Crack error: '+esc(c.error)+'</div>'; }
      else if(c.done && (s.passwords||0)===0){ html += '<div class="crackbar ok">Crack finished — no weak password found</div>'; }

      var canCrack = s.accounts && s.accounts.length && !c.running;
      html += '<div class="action"><button class="btn" id="crackbtn" '+(canCrack?'':'disabled')+'>'+
              (c.running?'Cracking…':'Crack captured hashes')+'</button></div>';

      var b = document.getElementById('body'); b.innerHTML = html;
      var cb = document.getElementById('crackbtn');
      if(cb && canCrack) cb.onclick = function(){ cb.disabled=true; cb.textContent='Cracking…'; fetch('/mole/crack').then(poll).catch(function(){}); };
    }

    function poll(){ fetch('/mole/state',{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){}); }
    poll(); setInterval(poll, 4000);
  </script>
</body>
</html>
