<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Mole</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .topbar {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .back { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .tete { width:26px; height:26px; color:#c98a3a; }
    .title { font-size:16px; font-weight:600; flex:1; }
    .btn { border:1px solid #30363d; color:#e6edf3; background:none; border-radius:8px;
           padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer;
           text-decoration:none; font-family:inherit; }
    .btn.run { border-color:#c98a3a; color:#c98a3a; }
    .btn.run.on { background:#c98a3a; color:#2a1a06; }
    .btn:disabled { opacity:.5; }

    .warn { flex:0 0 auto; font-size:12px; color:#3a1d00; background:#f0883e; font-weight:600;
            padding:8px 14px; }

    .verdict { flex:0 0 auto; margin:10px 12px 4px; border-radius:10px; padding:9px 12px;
               border:1px solid #30363d; background:#161b22; }
    .verdict .vlabel { font-size:15px; font-weight:600; }
    .verdict .vdetail { font-size:11px; color:#8b949e; margin-top:2px; }
    .verdict.critical { background:#2a0f0f; border-color:#a32d2d; }
    .verdict.critical .vlabel { color:#f2a3a3; }
    .verdict.critical .vdetail { color:#c98a8a; }
    .verdict.warning { background:#241a00; border-color:#8a6d16; }
    .verdict.warning .vlabel { color:#e3b341; }
    .verdict.idle .vlabel { color:#8b949e; }

    .body { flex:1 1 auto; overflow-y:auto; padding:4px 12px 12px; }
    .section-label { font-size:11px; color:#6e757e; margin:10px 2px 5px; }
    .acct { background:#10140f; border:1px solid #2b3a22; border-radius:8px;
            padding:7px 10px; margin-bottom:6px; font-family:ui-monospace,Consolas,monospace;
            font-size:11px; display:flex; justify-content:space-between; gap:8px; }
    .acct.locked { background:#161b22; border-color:#30363d; }
    .acct .who { color:#e6edf3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .acct .pw { color:#a9d683; flex:0 0 auto; }
    .acct.locked .pw { color:#7a818a; }
    .row { display:flex; align-items:center; justify-content:space-between;
           background:#161b22; border-radius:8px; padding:8px 10px; margin-bottom:6px; }
    .row .k { font-size:12px; color:#8b949e; }
    .row .v { font-size:13px; font-weight:600; }
    .row .v .dom { font-family:ui-monospace,Consolas,monospace; color:#c9cdd3; font-weight:400; }
    .host { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:#8b949e;
            padding:3px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty { color:#8b949e; font-size:13px; text-align:center; margin-top:46px; line-height:1.7; }
    .actions { display:flex; gap:8px; margin-top:12px; }
    .actions .btn { flex:1; text-align:center; padding:13px 12px; font-size:14px; }
    .crackbar { flex:0 0 auto; margin:0 12px; font-size:12px; font-weight:500;
                border-radius:8px; padding:0; max-height:0; overflow:hidden;
                transition:max-height .2s, padding .2s; }
    .crackbar.show { padding:8px 12px; max-height:60px; margin-bottom:4px; }
    .crackbar.run { background:#1b2733; border:0.5px solid #2f5d86; color:#79b8e8; }
    .crackbar.ok  { background:#13261a; border:0.5px solid #2b6d3f; color:#7bd88f; }
    .crackbar.err { background:#2a0f0f; border:0.5px solid #a32d2d; color:#f2a3a3; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="/">&larr;</a>
    <svg class="tete" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="4" rx="1"/><rect x="3" y="17" width="6" height="4" rx="1"/>
      <rect x="15" y="17" width="6" height="4" rx="1"/><path d="M12 7v3M6 17v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/>
    </svg>
    <div class="title">Mole</div>
    <a class="btn run {{ 'on' if snap.active }}" href="/mole/toggle">{{ 'Stop' if snap.active else 'Start' }}</a>
  </div>

  {% if err == 'eth' %}
  <div class="warn">Plug in an Ethernet cable first — Mole is a wired drop box.</div>
  {% elif err == 'start' %}
  <div class="warn">Could not start the capture service. Check the install.</div>
  {% endif %}

  <div class="verdict" id="verdict"><div class="vlabel">…</div><div class="vdetail"></div></div>

  <div class="crackbar" id="crackbar"></div>

  <div class="body" id="body"></div>

  <script>
    function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

    function render(s){
      var v = document.getElementById('verdict');
      v.className = 'verdict ' + (s.verdict && s.verdict.level || 'idle');
      v.innerHTML = '<div class="vlabel">' + esc(s.verdict && s.verdict.label) + '</div>' +
                    '<div class="vdetail">' + esc(s.verdict && s.verdict.detail) + '</div>';

      var b = document.getElementById('body');
      var html = '';

      if(s.accounts && s.accounts.length){
        html += '<div class="section-label">Credentials captured (' + s.accounts.length + ')</div>';
        s.accounts.forEach(function(a){
          var who = esc((a.domain ? a.domain + '\\' : '') + a.user);
          if(a.cracked){
            html += '<div class="acct"><span class="who">' + who + '</span><span class="pw">' + esc(a.password) + '</span></div>';
          } else {
            html += '<div class="acct locked"><span class="who">' + who + '</span><span class="pw">hash only</span></div>';
          }
        });
      }

      html += '<div class="section-label">Network</div>';
      html += '<div class="row"><span class="k">Domain</span><span class="v"><span class="dom">' +
              esc(s.domain || '—') + '</span></span></div>';
      html += '<div class="row"><span class="k">Passwords recovered</span><span class="v">' + (s.passwords || 0) + '</span></div>';
      html += '<div class="row"><span class="k">Machines found</span><span class="v">' + (s.host_count || 0) + '</span></div>';

      if(s.hosts && s.hosts.length){
        html += '<div class="section-label">Hosts</div>';
        s.hosts.slice(0, 12).forEach(function(h){
          html += '<div class="host">' + esc(h.ip) + (h.vendor ? ' · ' + esc(h.vendor) : '') + '</div>';
        });
      }

      if(!s.accounts || !s.accounts.length){
        if(s.active){
          html = '<div class="empty">Listening on the network…<br>Captured credentials will appear here.</div>' + html;
        } else {
          html = '<div class="empty">Plug into a network and press Start.<br>Mole captures credentials and maps the LAN.</div>' + html;
        }
      }

      var c = s.crack || {};
      html += '<div class="actions">';
      var canCrack = s.accounts && s.accounts.length && !c.running;
      html += '<button class="btn" id="crackbtn" ' + (canCrack ? '' : 'disabled') + '>' +
              (c.running ? 'Cracking…' : 'Crack captured hashes') + '</button>';
      html += '</div>';

      b.innerHTML = html;

      var bar = document.getElementById('crackbar');
      bar.className = 'crackbar';
      if(c.running){
        var left = Math.max(0, (c.started + c.max) - Math.floor(Date.now()/1000));
        bar.className = 'crackbar show run';
        bar.textContent = 'Cracking in progress… ' + left + 's left';
      } else if(c.error === 'needs John jumbo'){
        bar.className = 'crackbar show err';
        bar.textContent = 'Cracking unavailable — John jumbo not installed';
      } else if(c.error){
        bar.className = 'crackbar show err';
        bar.textContent = 'Crack error: ' + esc(c.error);
      } else if(c.done && (s.passwords || 0) === 0){
        bar.className = 'crackbar show ok';
        bar.textContent = 'Crack finished — no password found (robust)';
      }
      var cb = document.getElementById('crackbtn');
      if(cb && canCrack){
        cb.onclick = function(){
          cb.disabled = true; cb.textContent = 'Cracking…';
          fetch('/mole/crack').then(poll).catch(function(){});
        };
      }
    }

    function poll(){
      fetch('/mole/state', {cache:'no-store'})
        .then(function(r){ return r.json(); })
        .then(render)
        .catch(function(){});
    }
    poll();
    setInterval(poll, 4000);
  </script>
</body>
</html>
