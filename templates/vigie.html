<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Sentry</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre {
      height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#161b22; border-bottom:1px solid #30363d;
    }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .tete { width:28px; height:28px; }
    .titre { font-size:16px; font-weight:600; flex:1; }
    .scan-btn { border:1px solid #28c0d4; color:#28c0d4; background:none; border-radius:8px;
                padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; }
    .scan-btn:disabled { opacity:.5; }
    .watch { border-color:#28c0d4; color:#28c0d4; }
    .watch.on { background:#28c0d4; color:#06222a; }
    .force { border-color:#e3b341; color:#e3b341; }
    .force.on { background:#e3b341; color:#241a00; }
    .bandeau { flex:0 0 auto; font-size:12px; color:#06222a; background:#28c0d4; font-weight:600;
               padding:7px 14px; }
    .bandeau .pulse { animation:pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity:.35; } }
    .bilan { flex:0 0 auto; font-size:12px; color:#8b949e; padding:9px 14px; background:#10151c; }
    .bilan b { color:#e6edf3; }
    .bilan .inc { color:#f0883e; font-weight:700; }
    .liste { flex:1 1 auto; overflow-y:auto; padding:8px 12px; }
    .ligne {
      display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px;
      background:#161b22; border:1px solid #30363d; border-radius:10px;
    }
    .ligne.inconnu { border-color:#f0883e; }
    .lien { flex:1; min-width:0; display:flex; align-items:center; gap:10px;
            text-decoration:none; color:inherit; }
    .ico { width:26px; height:26px; flex:0 0 auto; color:#8b949e; }
    .ico.router { color:#28c0d4; }
    .ico.pi { color:#2ea043; }
    .ligne.inconnu .ico { color:#f0883e; }
    .infos { flex:1; min-width:0; }
    .rnom { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rbssid { font-size:11px; color:#8b949e; font-family:ui-monospace,Consolas,monospace;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chip { border:none; border-radius:8px; font-size:12px; font-weight:600; padding:7px 12px;
            white-space:nowrap; cursor:pointer; font-family:inherit; }
    .chip.moi { background:#133a2a; color:#2ea043; border:1px solid #1e5a40; }
    .chip.inc { background:#f0883e; color:#3a1d00; }
    .chip.pi  { background:#10303a; color:#28c0d4; border:1px solid #1d5663; cursor:default; }
    .vide { color:#8b949e; font-size:13px; text-align:center; margin-top:40px; line-height:1.7; }

    /* Radar animation during the scan */
    .scanning { display:flex; flex-direction:column; align-items:center; justify-content:center;
                height:100%; gap:16px; }
    .radar { width:96px; height:96px; border-radius:50%; position:relative;
             background:
               radial-gradient(circle, transparent 0 2px, #1b2b2e 2px 3px, transparent 3px) center/32px 32px,
               #10191b;
             border:1px solid #1d5663; overflow:hidden; }
    .radar::after { content:""; position:absolute; inset:0; border-radius:50%;
      background:conic-gradient(from 0deg, rgba(40,192,212,.55), rgba(40,192,212,0) 70%);
      animation:sweep 1.4s linear infinite; }
    .radar .pt { position:absolute; width:5px; height:5px; border-radius:50%; background:#28c0d4;
                 box-shadow:0 0 6px #28c0d4; }
    @keyframes sweep { to { transform:rotate(360deg); } }
    .scanning .txt { font-size:13px; color:#8b949e; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/">&larr;</a>
    <img class="tete" src="/static/vigie.png" alt="">
    <div class="titre">Sentry</div>
    <button class="scan-btn watch" id="watch" onclick="toggleWatch()">Watch</button>
    <button class="scan-btn force" id="force" onclick="toggleForce()" style="display:none">Force DNS</button>
    <button class="scan-btn" id="rescan" onclick="runScan()">Rescan</button>
  </div>

  <div class="bandeau" id="bandeau" style="display:none"><span class="pulse">●</span> Monitoring traffic — open a device to see the domains it contacts</div>

  <div class="bilan" id="bilan">Scanning the network…</div>

  <div class="liste" id="liste">
    <div class="scanning">
      <div class="radar"><span class="pt" style="top:30%;left:60%"></span><span class="pt" style="top:62%;left:40%"></span></div>
      <div class="txt">Scanning the network…</div>
    </div>
  </div>

  <script>
    var devices = [];

    function save(){ try { sessionStorage.setItem('vigie_devices', JSON.stringify(devices)); } catch(e){} }
    function loadCache(){ try { var v = sessionStorage.getItem('vigie_devices'); return v ? JSON.parse(v) : null; } catch(e){ return null; } }

    function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

    function iconSvg(type){
      if(type === 'router')
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01"/><path d="M12 13V9M8.5 9a3.5 3.5 0 0 1 7 0"/></svg>';
      if(type === 'pi')
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>';
    }

    function ipKey(ip){ return ip.split('.').map(function(n){ return ('00'+n).slice(-3); }).join('.'); }

    function sortDevices(){
      devices.sort(function(a,b){
        if(a.inconnu !== b.inconnu) return a.inconnu ? -1 : 1;
        return ipKey(a.ip) < ipKey(b.ip) ? -1 : 1;
      });
    }

    function render(){
      sortDevices();
      var inconnus = devices.filter(function(d){ return d.inconnu; }).length;
      var n = devices.length;
      document.getElementById('bilan').innerHTML =
        '<b>' + n + '</b> device' + (n !== 1 ? 's' : '') + ' on the network' +
        (inconnus ? ' · <span class="inc">' + inconnus + ' unknown</span>' : '');

      var liste = document.getElementById('liste');
      if(!n){ liste.innerHTML = '<div class="vide">No device found.<br>Tap "Rescan" to scan the network.</div>'; return; }
      liste.innerHTML = '';
      devices.forEach(function(d){
        var row = document.createElement('div');
        row.className = 'ligne' + (d.inconnu ? ' inconnu' : '');

        var a = document.createElement('a');
        a.className = 'lien'; a.href = '/vigie/device/' + d.ip;
        a.innerHTML = '<span class="ico ' + d.type + '">' + iconSvg(d.type) + '</span>' +
          '<div class="infos"><div class="rnom">' + esc(d.nom) + '</div>' +
          '<div class="rbssid">' + esc(d.ip) + (d.mac ? ' · ' + esc(d.mac) : '') + '</div></div>';
        row.appendChild(a);

        var chip;
        if(d.pi){ chip = document.createElement('span'); chip.className = 'chip pi'; chip.textContent = 'This Pi'; }
        else if(d.routeur){ chip = document.createElement('span'); chip.className = 'chip pi'; chip.textContent = 'Router'; }
        else if(d.mien){ chip = document.createElement('button'); chip.className = 'chip moi'; chip.textContent = 'Mine';
                         chip.onclick = function(){ mark(d, false); }; }
        else { chip = document.createElement('button'); chip.className = 'chip inc'; chip.textContent = 'Unknown';
               chip.onclick = function(){ mark(d, true); }; }
        row.appendChild(chip);
        liste.appendChild(row);
      });
    }

    function mark(d, mien){
      if(!d.mac) return;
      d.mien = mien;
      d.inconnu = !mien && !d.pi && !d.routeur;
      render();
      save();
      fetch('/vigie/' + (mien ? 'mien' : 'pasmien') + '/' + encodeURIComponent(d.mac)).catch(function(){});
    }

    function runScan(){
      var btn = document.getElementById('rescan'); btn.disabled = true;
      document.getElementById('bilan').textContent = 'Scanning the network…';
      document.getElementById('liste').innerHTML =
        '<div class="scanning"><div class="radar"><span class="pt" style="top:30%;left:60%"></span><span class="pt" style="top:62%;left:40%"></span></div><div class="txt">Scanning the network…</div></div>';
      fetch('/vigie/data').then(function(r){ return r.json(); }).then(function(data){
        devices = data.appareils || [];
        render();
        save();
      }).catch(function(){
        document.getElementById('liste').innerHTML = '<div class="vide">Scan failed.<br>Tap "Rescan" to try again.</div>';
        document.getElementById('bilan').textContent = '';
      }).finally(function(){ btn.disabled = false; });
    }

    // --- Traffic monitoring (bettercap MITM) ---
    var monitoring = false;
    var forcing = false;
    function updateWatch(){
      var b = document.getElementById('watch');
      b.textContent = monitoring ? 'Stop' : 'Watch';
      b.classList.toggle('on', monitoring);
      document.getElementById('bandeau').style.display = monitoring ? '' : 'none';
      // Force DNS is only available while watching.
      var f = document.getElementById('force');
      f.style.display = monitoring ? '' : 'none';
      if(!monitoring){ forcing = false; }
      updateForce();
    }
    function updateForce(){
      var f = document.getElementById('force');
      f.textContent = forcing ? 'DNS forced' : 'Force DNS';
      f.classList.toggle('on', forcing);
    }
    function toggleWatch(){
      var b = document.getElementById('watch'); b.disabled = true;
      fetch(monitoring ? '/vigie/monitor/stop' : '/vigie/monitor/start')
        .then(function(r){ return r.json(); })
        .then(function(j){ monitoring = !!j.actif; updateWatch(); })
        .catch(function(){})
        .finally(function(){ b.disabled = false; });
    }
    function toggleForce(){
      if(!monitoring){ return; }
      var f = document.getElementById('force'); f.disabled = true;
      fetch('/vigie/monitor/force?on=' + (forcing ? '0' : '1'))
        .then(function(r){ return r.json(); })
        .then(function(j){ forcing = !!j.force; updateForce(); })
        .catch(function(){})
        .finally(function(){ f.disabled = false; });
    }
    // current monitoring state (persisted server-side across pages)
    fetch('/vigie/monitor/data').then(function(r){ return r.json(); })
      .then(function(j){ monitoring = !!j.actif; forcing = !!j.force; updateWatch(); }).catch(function(){});

    // On return (from a detail view), re-display the last saved scan without
    // re-running it: it's up to the user to click "Rescan".
    var memo = loadCache();
    if(memo){ devices = memo; render(); } else { runScan(); }
  </script>
</body>
</html>
