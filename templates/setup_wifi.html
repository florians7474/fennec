<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fennec — Wi-Fi</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; background:#0d1117; color:#e6edf3;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  .wrap { height:100%; display:flex; flex-direction:column; }
  .top { padding:8px 12px; display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:16px; font-weight:700; }
  .sub { font-size:12px; color:#8b949e; }
  .err { margin:0 12px 6px; background:#3d1d1d; border:1px solid #f85149; color:#ffb3ad;
    font-size:12px; padding:6px 8px; border-radius:8px; }
  .ok { margin:0 12px 6px; background:#12331f; border:1px solid #2ea043; color:#7ee2a8;
    font-size:12px; padding:6px 8px; border-radius:8px; }
  .list { flex:1; overflow-y:auto; padding:0 12px; }
  .net { width:100%; text-align:left; display:flex; align-items:center; gap:8px;
    background:#161b22; border:1px solid #30363d; color:#e6edf3; border-radius:10px;
    padding:10px 12px; margin-bottom:6px; font-size:14px; }
  .net:active { background:#21262d; }
  .net .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .net .meta { font-size:12px; color:#8b949e; }
  .foot { padding:8px 12px; display:flex; gap:8px; }
  .btn { flex:1; background:#161b22; border:1px solid #30363d; color:#e6edf3;
    border-radius:10px; padding:10px; font-size:13px; }
  .btn.primary { background:#01F994; border-color:#01F994; color:#07120c; font-weight:700; }
  .btn:active { filter:brightness(1.15); }
  /* password + keyboard panel */
  .panel { position:fixed; inset:0; background:#0d1117; display:none; flex-direction:column; }
  .panel.show { display:flex; }
  .pbar { padding:8px 12px; }
  .pbar .for { font-size:13px; color:#8b949e; }
  .pwrow { display:flex; gap:6px; padding:0 12px 6px; }
  .pwrow input { flex:1; background:#161b22; border:1px solid #30363d; color:#e6edf3;
    border-radius:8px; padding:10px; font-size:16px; }
  .pwrow .eye { width:44px; background:#161b22; border:1px solid #30363d; color:#8b949e; border-radius:8px; }
  .kb { margin-top:auto; padding:4px; background:#010409; }
  .krow { display:flex; justify-content:center; gap:4px; margin-bottom:4px; }
  .key { flex:1; max-width:9%; background:#21262d; border:1px solid #30363d; color:#e6edf3;
    border-radius:6px; height:38px; font-size:15px; }
  .key:active { background:#30363d; }
  .key.wide { max-width:18%; font-size:12px; color:#8b949e; }
  .key.space { max-width:40%; }
  .kact { display:flex; gap:6px; padding:6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">Connect to Wi-Fi</div>
        <div class="sub">
          {% if conn.type %}Connected: {{ conn.name }}{% else %}Pick your network{% endif %}
        </div>
      </div>
    </div>

    {% if err %}<div class="err">{{ err }}</div>{% endif %}
    {% if conn.type %}<div class="ok">Already connected to {{ conn.name }}.</div>{% endif %}

    <div class="list">
      {% for n in networks %}
      <button class="net" onclick="pick('{{ n.ssid|e }}','{{ n.bssid|e }}',{{ 'true' if n.secure else 'false' }})">
        <span class="name">{{ n.ssid }}</span>
        <span class="meta">{{ n.signal }}%{% if n.secure %} &#128274;{% endif %}</span>
      </button>
      {% else %}
      <div class="sub" style="padding:16px 4px">No network found. Tap Rescan.</div>
      {% endfor %}
    </div>

    <div class="foot">
      <button class="btn" onclick="location.href='/setup/wifi'">Rescan</button>
      <button class="btn" onclick="location.href='/setup/wifi/skip'">Skip</button>
    </div>
  </div>

  <!-- password + on-screen keyboard -->
  <div class="panel" id="panel">
    <div class="pbar"><span class="for">Network:</span> <b id="pssid"></b></div>
    <div class="pwrow">
      <input id="pw" type="password" placeholder="Password" readonly>
      <button class="eye" onclick="toggleEye()">&#128065;</button>
    </div>
    <div class="kact">
      <button class="btn" onclick="hidePanel()">Cancel</button>
      <button class="btn primary" onclick="doConnect()">Connect</button>
    </div>
    <div class="kb" id="kb"></div>
  </div>

  <form id="cform" method="post" action="/setup/wifi/connect" style="display:none">
    <input type="hidden" name="ssid" id="fssid">
    <input type="hidden" name="bssid" id="fbssid">
    <input type="hidden" name="key" id="fkey">
  </form>

<script>
  var selSsid="", selBssid="", shift=false, sym=false;
  var pw=document.getElementById("pw");

  function pick(ssid,bssid,secure){
    selSsid=ssid; selBssid=bssid;
    if(!secure){ submitConnect(ssid,bssid,""); return; }   // open network
    document.getElementById("pssid").textContent=ssid;
    pw.value=""; pw.type="password";
    document.getElementById("panel").classList.add("show");
    render();
  }
  function hidePanel(){ document.getElementById("panel").classList.remove("show"); }
  function toggleEye(){ pw.type = pw.type==="password" ? "text" : "password"; }
  function doConnect(){
    if(pw.value.length<1){ return; }
    submitConnect(selSsid,selBssid,pw.value);
  }
  function submitConnect(ssid,bssid,key){
    document.getElementById("fssid").value=ssid;
    document.getElementById("fbssid").value=bssid;
    document.getElementById("fkey").value=key;
    document.getElementById("cform").submit();
  }

  var letters=[["q","w","e","r","t","y","u","i","o","p"],
               ["a","s","d","f","g","h","j","k","l"],
               ["z","x","c","v","b","n","m"]];
  var symbols=[["1","2","3","4","5","6","7","8","9","0"],
               ["@","#","$","%","&","-","_","+","(",")"],
               [".",",",":",";","!","?","/","*"]];
  function render(){
    var kb=document.getElementById("kb"); kb.innerHTML="";
    var rows = sym ? symbols : letters;
    rows.forEach(function(row,ri){
      var d=document.createElement("div"); d.className="krow";
      if(!sym && ri===2){ d.appendChild(mk(shift?"↑":"⇧","wide",function(){shift=!shift;render();})); }
      row.forEach(function(c){
        var label = (!sym && shift) ? c.toUpperCase() : c;
        d.appendChild(mk(label,"",function(){ type(label); if(shift){shift=false;render();} }));
      });
      if(!sym && ri===2){ d.appendChild(mk("⌫","wide",function(){ pw.value=pw.value.slice(0,-1); })); }
      if(sym && ri===2){ d.appendChild(mk("⌫","wide",function(){ pw.value=pw.value.slice(0,-1); })); }
      kb.appendChild(d);
    });
    var last=document.createElement("div"); last.className="krow";
    last.appendChild(mk(sym?"ABC":"?123","wide",function(){sym=!sym;render();}));
    last.appendChild(mk("space","space",function(){type(" ");}));
    kb.appendChild(last);
  }
  function mk(label,cls,fn){
    var b=document.createElement("button");
    b.className="key"+(cls?" "+cls:""); b.textContent=label;
    b.addEventListener("click",fn);
    return b;
  }
  function type(c){ pw.value += c; }
</script>
</body>
</html>
