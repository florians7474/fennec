<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, initial-scale=1">
  <title>Metasploit</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      width:480px; height:320px; overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; flex-direction:column;
    }
    .barre { height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 12px;
             background:#161b22; border-bottom:1px solid #30363d; }
    .retour { color:#e6edf3; text-decoration:none; font-size:24px; line-height:1; padding:2px 8px; }
    .titre { font-size:16px; font-weight:600; flex:1; }
    .state { display:flex; align-items:center; gap:7px; font-size:12px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#6e7681; }
    .dot.up { background:#2ea043; box-shadow:0 0 6px #2ea043; }
    .dot.down { background:#f85149; }
    .corps { flex:1 1 auto; overflow-y:auto; padding:12px 14px; }
    .err { margin-bottom:10px; padding:8px 12px; background:#2d1518; border:1px solid #6e2f36;
           border-radius:8px; color:#ffa198; font-size:12px; }
    .ok { margin-bottom:10px; padding:9px 12px; background:#10251a; border:1px solid #1e5a40;
          border-radius:8px; color:#3fb950; font-size:13px; }
    .step { display:flex; gap:9px; margin-bottom:9px; font-size:12px; color:#c9d1d9; line-height:1.4; }
    .num { flex:0 0 20px; height:20px; border-radius:50%; background:#1b1442; color:#b9a7f5;
           border:1px solid #3a2e6b; font-size:11px; font-weight:700; display:flex;
           align-items:center; justify-content:center; }
    .cmd { background:#010409; border:1px solid #30363d; border-radius:8px; padding:9px 11px;
           font-family:ui-monospace,Consolas,monospace; font-size:12px; color:#8b7fd4;
           margin:4px 0 12px; white-space:nowrap; overflow-x:auto; }
    label { display:block; font-size:11px; color:#8b949e; margin:9px 0 4px; }
    input { width:100%; background:#0d1117; border:1px solid #30363d; border-radius:8px;
            color:#e6edf3; font-size:14px; padding:9px 10px; }
    .hostline { display:flex; gap:8px; }
    .hostline input { flex:1; }
    .btn { border:none; border-radius:8px; font-size:13px; font-weight:600; padding:9px 14px;
           cursor:pointer; font-family:inherit; white-space:nowrap; text-decoration:none;
           display:inline-block; }
    .scan { background:none; border:1px solid #8b7fd4; color:#b9a7f5; }
    .go { background:#8b7fd4; color:#1a1230; width:100%; margin-top:12px; }
    .off { background:#30363d; color:#e6edf3; }
    .found { margin-top:7px; display:flex; flex-wrap:wrap; gap:6px; }
    .hostchip { background:#1b1442; color:#b9a7f5; border:1px solid #3a2e6b; border-radius:7px;
                padding:6px 10px; font-size:12px; cursor:pointer; font-family:ui-monospace,monospace; }
    .scanmsg { font-size:11px; color:#8b949e; margin-top:6px; }
  </style>
</head>
<body>
  <div class="barre">
    <a class="retour" href="/hugin">&larr;</a>
    <div class="titre">Metasploit</div>
    <div class="state"><span class="dot" id="dot"></span><span id="statetxt">…</span></div>
  </div>

  <div class="corps">
    {% if err %}<div class="err">{{ err }}</div>{% endif %}
    <div class="ok" id="okbox" style="display:none"></div>

    <div id="setup">
      <div class="step"><span class="num">1</span><span>On your lab machine (not the Pi), start Metasploit's RPC server with the command below.</span></div>
      <div class="cmd" id="cmd">msfrpcd -P &lt;your-password&gt; -S -a 0.0.0.0</div>
      <div class="step"><span class="num">2</span><span>Tap <b>Scan</b> to find that machine on your network.</span></div>
      <div class="step"><span class="num">3</span><span>Enter the same password and tap <b>Connect</b>.</span></div>

      <form method="post" action="/hugin/msf/connect">
        <label>Host</label>
        <div class="hostline">
          <input name="host" id="host" placeholder="192.168.1.20" value="{{ request.args.get('host') or cfg.host or '' }}" autocomplete="off">
          <button class="btn scan" type="button" onclick="scan()">Scan</button>
        </div>
        <div class="found" id="found"></div>
        <div class="scanmsg" id="scanmsg"></div>

        <label>RPC password</label>
        <input name="password" id="pass" type="password" placeholder="the password you chose above" autocomplete="off">
        <input type="hidden" name="port" value="{{ default_port }}">

        <button class="btn go" type="submit">Connect</button>
      </form>
    </div>

    <div id="connected" style="display:none">
      <a class="btn off" href="/hugin/msf/disconnect">Disconnect</a>
    </div>
  </div>

  <script src="/static/keyboard.js"></script>
  <script>
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

    var passInput = document.getElementById('pass');
    var cmd = document.getElementById('cmd');
    function updateCmd(){
      var p = passInput.value || '<your-password>';
      cmd.textContent = 'msfrpcd -P ' + p + ' -S -a 0.0.0.0';
    }
    passInput.addEventListener('input', updateCmd);

    function scan(){
      var msg = document.getElementById('scanmsg');
      msg.textContent = 'Scanning the network…';
      document.getElementById('found').innerHTML = '';
      fetch('/hugin/msf/scan').then(function(r){return r.json();}).then(function(d){
        var hosts = d.hosts || [];
        if(!hosts.length){ msg.textContent = 'No Metasploit RPC found. Is msfrpcd running on your lab machine?'; return; }
        msg.textContent = hosts.length + ' host(s) found — tap to use:';
        var box = document.getElementById('found');
        hosts.forEach(function(h){
          var b = document.createElement('span'); b.className='hostchip'; b.textContent=h;
          b.onclick=function(){ document.getElementById('host').value=h; };
          box.appendChild(b);
        });
      }).catch(function(){ msg.textContent='Scan failed.'; });
    }

    function refreshState(){
      fetch('/hugin/msf/state').then(function(r){return r.json();}).then(function(s){
        var dot=document.getElementById('dot'), txt=document.getElementById('statetxt');
        var setup=document.getElementById('setup'), conn=document.getElementById('connected');
        var ok=document.getElementById('okbox');
        if(s.connected){
          dot.className='dot up'; txt.textContent='Connected';
          ok.style.display=''; ok.textContent='Connected to '+s.host+' · Metasploit '+(s.version||'');
          setup.style.display='none'; conn.style.display='';
        } else if(s.configured){
          dot.className='dot down'; txt.textContent='Offline';
          ok.style.display='none'; setup.style.display=''; conn.style.display='none';
          if(s.error){ document.getElementById('scanmsg').textContent=s.error; }
        } else {
          dot.className='dot'; txt.textContent='Not set up';
          ok.style.display='none'; setup.style.display=''; conn.style.display='none';
        }
      }).catch(function(){ document.getElementById('statetxt').textContent='?'; });
    }
    refreshState();
  </script>
</body>
</html>
